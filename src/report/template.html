<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 Opening Report</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --fg: #1b1e24; --muted: #667085; --border: #e3e6eb;
  --a: #e8833a; --b: #3b82f6; --mid: #22a06b; --unk: #9aa3af; --accent: #6d5dfc;
  --bar-bg: #eef0f3; --warn-bg: #fff7e6; --warn-fg: #8a5a00;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1115; --card: #181b21; --fg: #e8eaee; --muted: #9aa3b2; --border: #2a2f38;
    --bar-bg: #232832; --warn-bg: #2b2414; --warn-fg: #f0c36a;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 22px; margin: 0 0 4px; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.lang { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--card); }
.lang button { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; color: var(--fg); padding: 5px 10px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600; }
.lang button svg { width: 22px; height: 15px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0,0,0,.25); display: block; }
.lang button.on { background: var(--accent); color: #fff; }
.loginlink { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 8px; background: #171a21; color: #fff;
  text-decoration: none; font-size: 13px; font-weight: 600; border: 1px solid #2a475e; }
.loginlink svg { width: 18px; height: 18px; }
h2 { font-size: 17px; margin: 0 0 12px; }
h3 { font-size: 14px; margin: 16px 0 8px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.sub { color: var(--muted); margin: 0 0 16px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 16px 0; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--card); }
.seg button { border: 0; background: none; color: var(--fg); padding: 6px 12px; cursor: pointer; font: inherit; }
.seg button.on { background: var(--accent); color: #fff; }
.label { color: var(--muted); font-size: 12px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; min-width: 0; }
.section { margin-top: 24px; }
.big { font-size: 26px; font-weight: 700; }
.reco { display: flex; gap: 10px; flex-wrap: wrap; margin: 8px 0 4px; }
.pill { border-radius: 999px; padding: 6px 14px; font-weight: 700; color: #fff; }
.pill.A { background: var(--a); } .pill.B { background: var(--b); } .pill.Mid { background: var(--mid); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat .v { font-size: 20px; font-weight: 700; } .stat .k { color: var(--muted); font-size: 12px; }
.bar-row { display: grid; grid-template-columns: 130px 1fr 70px; gap: 8px; align-items: center; margin: 4px 0; }
.bar { height: 14px; background: var(--bar-bg); border-radius: 4px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar > i.A { background: var(--a); } .bar > i.B { background: var(--b); } .bar > i.Mid { background: var(--mid); }
.num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.r, th.r { text-align: right; }
.split { display: flex; height: 10px; border-radius: 4px; overflow: hidden; min-width: 120px; background: var(--bar-bg); }
.split i { display: block; height: 100%; }
.split .A { background: var(--a); } .split .B { background: var(--b); } .split .Mid { background: var(--mid); } .split .unknown { background: var(--unk); }
.line { font-family: ui-monospace, Consolas, monospace; font-size: 12px; white-space: normal; }
.warn { background: var(--warn-bg); color: var(--warn-fg); border-radius: 8px; padding: 8px 12px; margin: 8px 0; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; }
svg.map { width: 100%; max-width: 820px; height: auto; display: block; margin: 8px auto 0; background: #20242b; border-radius: 8px; }
select { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; max-width: 100%; }
a { color: inherit; }
.callout { font-weight: 600; font-family: system-ui, sans-serif; fill: #fff; paint-order: stroke; stroke: #000; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.muted { color: var(--muted); }
.rt { display: inline-block; min-width: 30px; text-align: center; border-radius: 4px; padding: 0 4px; font-weight: 700; color: #fff; font-size: 12px; }
.rt.A { background: var(--a); } .rt.B { background: var(--b); } .rt.Mid { background: var(--mid); } .rt.unknown { background: var(--unk); }
table.routes td, table.routes th { vertical-align: top; }
table.routes td.cell { min-width: 120px; white-space: normal; font-size: 12px; line-height: 1.35; }
table.routes td.cell small { color: var(--muted); display: block; }
table.routes th.rnd { cursor: pointer; text-align: center; }
table.routes th.rnd:hover { color: var(--fg); }
table.routes td.team-head { padding: 10px 8px 6px; font-weight: 700; border-bottom: 2px solid var(--border); }
table.routes td.team-head > span { position: sticky; left: 8px; }
.team-title { margin: 16px 0 6px; font-size: 14px; } .team-title:first-child { margin-top: 0; }
.team-title.ours { color: var(--mid); } .team-title.enemy { color: #ef4444; }
table.routes .sel { background: color-mix(in srgb, var(--accent) 14%, transparent); }
table.routes td.sticky, table.routes th.sticky { position: sticky; left: 0; background: var(--card); z-index: 1; }
table.routes { table-layout: fixed; width: max-content; }
table.routes td.sticky, table.routes th.sticky { width: 190px; min-width: 190px; max-width: 190px; white-space: normal; }
table.routes td.cell, table.routes th.rnd { width: 120px; }
.wicon { display: inline-flex; align-items: center; gap: 4px; background: #23272e; color: #e8eaee; border-radius: 6px; padding: 2px 6px; margin: 2px 4px 2px 0; font-size: 12px; white-space: nowrap; }
.wicon img { height: 16px; width: auto; display: block; }
.wicon.big img { height: 22px; }
.body-wrap { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-top: 12px; }
.body-wrap svg { width: 200px; max-width: 45%; height: auto; flex: none; }
.body-wrap .body-list { flex: 1; min-width: 200px; }
.body-wrap .bar-row { grid-template-columns: 92px 1fr 64px; }
.legend i.heat-scale { display: inline-block; width: 120px; height: 8px; border-radius: 4px; vertical-align: middle; margin: 0 4px;
  background: linear-gradient(90deg, #2b6cff, #22c55e, #facc15, #ef4444); }
input[type=range] { width: 200px; vertical-align: middle; }
@media (max-width: 600px) { .bar-row { grid-template-columns: 100px 1fr 60px; } .stats { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <h1>CS2 Opening Report</h1>
    <div style="display:flex;gap:8px;align-items:center">
    <a class="loginlink" id="loginLink" href="/login" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-9.96 9.1l5.36 2.2a2.8 2.8 0 0 1 1.6-.5h.15l2.38-3.45v-.05a3.77 3.77 0 1 1 3.77 3.77h-.09l-3.4 2.42v.13a2.83 2.83 0 0 1-5.6.56L2.4 14.6A10 10 0 1 0 12 2Zm-4.7 15.2-1.23-.5a2.12 2.12 0 1 0 1.16-2.9l1.27.52a1.56 1.56 0 1 1-1.2 2.88Zm9.64-7.85a2.51 2.51 0 1 0-2.51 2.5 2.51 2.51 0 0 0 2.51-2.5Zm-4.39 0a1.89 1.89 0 1 1 1.89 1.88 1.89 1.89 0 0 1-1.89-1.88Z"/></svg><span data-i18n="steamLogin"></span></a>
    <div class="lang" id="langSeg" role="group" aria-label="Bahasa / Language">
      <button data-lang="id" title="Bahasa Indonesia"><svg viewBox="0 0 3 2" aria-hidden="true"><rect width="3" height="1" fill="#CE1126"/><rect y="1" width="3" height="1" fill="#fff"/></svg>ID</button>
      <button data-lang="en" title="English"><svg viewBox="0 0 60 30" aria-hidden="true"><clipPath id="ukc"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath><path d="M0,0 v30 h60 v-30 z" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ukc)" stroke="#C8102E" stroke-width="4"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg>EN</button>
    </div>
    </div>
  </div>
  <p class="sub" id="summary"></p>

  <div class="controls">
    <div><div class="label" data-i18n="playerLabel"></div><select id="playerSel"></select></div>
    <div><div class="label" data-i18n="mapLabel"></div><div class="seg" id="mapSeg"></div></div>
  </div>
  <div id="sampleWarn"></div>

  <div class="section">
    <h2><span data-i18n="movementTitle"></span> <span class="muted" id="mapTitle" style="font-weight:400"></span></h2>
    <div class="card">
      <div class="controls" style="margin-top:0">
        <div><div class="label" data-i18n="matchLabel"></div><select id="matchSel"></select></div>
        <div><div class="label" data-i18n="roundLabel"></div><select id="roundSel"></select></div>
        <div><div class="label" data-i18n="sideLabel"></div><div class="seg" id="sideSeg"></div></div>
        <div><div class="label"><span data-i18n="untilSecond"></span><b id="tVal"></b></div><input type="range" id="tRange" min="2" max="180" step="2" value="180"></div>
      </div>
      <label class="muted" style="font-size:12px"><input type="checkbox" id="calloutChk" checked> <span data-i18n="callouts"></span></label>
      <div class="legend" id="mapLegend"></div>
      <div id="mapSvg"></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 style="margin-top:0"><span data-i18n="routesTitle"></span> <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:400" data-i18n="routesHint"></span></h3>
      <div id="routeTable"></div>
    </div>
    <div class="grid" style="margin-top:16px">
      <div class="card"><h3 style="margin-top:0"><span data-i18n="killsTitle"></span> <span class="muted" id="combatScope" style="text-transform:none;letter-spacing:0;font-weight:400"></span></h3>
        <div class="table-wrap" id="weaponTable"></div></div>
      <div class="card"><h3 style="margin-top:0" data-i18n="bodyTitle"></h3>
        <div class="seg" id="hitSeg"></div>
        <div id="bodyTarget"></div></div>
    </div>
  </div>


  <div class="section">
    <h2 id="tHead"></h2>
    <div class="grid">
      <div class="card" id="recoCard"></div>
      <div class="card"><h3 style="margin-top:0" data-i18n="tStratTitle"></h3><div id="tStrat"></div></div>
      <div class="card"><h3 style="margin-top:0" data-i18n="tCountsTitle"></h3><div id="tCounts"></div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 style="margin-top:0" data-i18n="tLinesTitle"></h3><div id="tLines"></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 style="margin-top:0" data-i18n="tPlayersTitle"></h3><div class="table-wrap" id="tPlayers"></div>
    </div>
  </div>

  <div class="section">
    <h2 id="ctHead"></h2>
    <div class="grid">
      <div class="card" id="ctReco"></div>
      <div class="card"><h3 style="margin-top:0" data-i18n="ctSetupTitle"></h3><div id="ctSetups"></div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h3 style="margin-top:0" data-i18n="ctPlayersTitle"></h3><div class="table-wrap" id="ctPlayers"></div>
    </div>
  </div>

  <div class="section">
    <h2 data-i18n="perTeam"></h2>
    <div class="card"><div class="table-wrap" id="teamTable"></div></div>
  </div>

  <div class="section">
    <h2 data-i18n="openingKill"></h2>
    <div class="grid">
      <div class="card" id="fkSide"></div>
      <div class="card"><h3 style="margin-top:0" data-i18n="fkPlacesTitle"></h3><div id="fkPlaces"></div></div>
    </div>
  </div>
</div>

    fkTitle: "Who gets the first kill", tFirst: "T first", ctFirst: "CT first",
    fkNote: (team, s) => `Rounds with ${team} on T. Happens at second ${s} on average.`,
    warn: n => `Not much data yet (${n} team rounds for this filter). Percentages can change a lot as more demos come in.`,
    summary: (d, r, p) => `${d} demos · ${r} rounds · ${p} players`,
    sideAll: "All", hitDealt: "Their shots", hitTaken: "Shots taken",
  },
};
let lang = "id";
try { lang = localStorage.getItem("cs2-opening-lang") === "en" ? "en" : "id"; } catch (e) {}
const t = (key, ...args) => { const v = I18N[lang][key] ?? I18N.id[key] ?? key; return typeof v === "function" ? v(...args) : v; };
const ROUTES = ["A", "B", "Mid", "unknown"];
const COLORS = {A: "var(--a)", B: "var(--b)", Mid: "var(--mid)", unknown: "var(--unk)"};
const nameOf = Object.fromEntries(DATA.roster);
const DOT = Object.fromEntries(DATA.dot_columns.map((k, i) => [k, i]));
// Which team each player was on in each demo, and the demos each player is in
const teamOfPlayer = new Map(DATA.players.map(p => [p.demo_id + "|" + p.steamid, p.team_id]));
const demosOf = new Map();
DATA.players.forEach(p => { if (!demosOf.has(p.steamid)) demosOf.set(p.steamid, new Set()); demosOf.get(p.steamid).add(p.demo_id); });
const inScope = demo => !state.player || demosOf.get(state.player).has(demo);
const playerTeam = demo => teamOfPlayer.get(demo + "|" + state.player);
const scopedMatches = () => DATA.matches.filter(m => inScope(m.demo_id));
const scopedMaps = () => {
  const count = {};
  scopedMatches().forEach(m => count[m.map_name] = (count[m.map_name] || 0) + m.rounds);
  return Object.keys(count).sort((a, b) => count[b] - count[a]);
};

// Deep link: #<map>[/<match number on that map>[/<round>[/<steamid>]]], e.g. #de_anubis/2/5
const [hashMap, hashMatch, hashRound, hashPlayer] = decodeURIComponent(location.hash.slice(1)).split("/");
const state = {map: "", side: "T", t: Infinity, player: "", callouts: true, match: "", round: "", hitView: "dealt"};
state.player = demosOf.has(hashPlayer) ? hashPlayer : (demosOf.has(DATA.me.steamid) ? DATA.me.steamid : "");
state.map = scopedMaps().includes(hashMap) ? hashMap : scopedMaps()[0];
if (hashMatch) state.match = (scopedMatches().filter(m => m.map_name === state.map)[+hashMatch - 1] || {}).demo_id || "";
if (hashRound) state.round = hashRound;
const PLAYER_COLORS = ["#ff6b6b", "#4dabf7", "#ffd43b", "#69db7c", "#da77f2", "#ff922b", "#3bc9db", "#f783ac", "#a9e34b", "#ced4da"];
const steamLink = (sid, name) => `<a href="https://steamcommunity.com/profiles/${esc(sid)}" target="_blank" rel="noopener">${esc(name)}</a>`;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pct = (n, d) => d ? Math.round(100 * n / d) : 0;
const mean = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;
const mapName = m => m.replace(/^de_/, "").replace(/^./, c => c.toUpperCase());

function seg(el, options, key, onChange) {
  el.innerHTML = options.map(([v, label]) => `<button data-v="${esc(v)}">${esc(label)}</button>`).join("");
  const sync = () => el.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === String(state[key])));
  el.onclick = e => { const b = e.target.closest("button"); if (!b) return; state[key] = b.dataset.v; sync(); (onChange || render)(); };
  sync();
}

function bars(items, total, cls) {
  if (!total) return `<p class="muted">${t("noData")}</p>`;
  return items.map(([label, n, c]) => `<div class="bar-row"><span>${esc(label)}</span>
    <div class="bar"><i class="${c || cls || ""}" style="width:${pct(n, total)}%"></i></div>
    <span class="num">${pct(n, total)}% · ${n}</span></div>`).join("");
}

function countBy(rows, f) {
  const m = new Map();
  rows.forEach(r => { const k = f(r); m.set(k, (m.get(k) || 0) + 1); });
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}

function splitBar(counts, total) {
  return `<div class="split">${ROUTES.map(r => counts[r] ? `<i class="${r}" style="width:${pct(counts[r], total)}%" title="${r} ${pct(counts[r], total)}%"></i>` : "").join("")}</div>`;
}

// Team rounds for the current filters: with a player picked, only the team they were on
function teamRows(side) {
  return DATA.teams.filter(t => t.map_name === state.map && (!side || t.side === side) && (!state.match || t.demo_id === state.match) &&
    inScope(t.demo_id) && (!state.player || t.team_id === playerTeam(t.demo_id)));
}
function playerRows(side) {
  return DATA.players.filter(p => p.map_name === state.map && p.side === side && (!state.match || p.demo_id === state.match) &&
    (!state.player || p.steamid === state.player));
}
const whoText = () => state.player ? nameOf[state.player] : t("allPlayers");
const teamText = () => state.player ? t("teamOf", nameOf[state.player]) : t("allTeams");

// Spread 5 defenders over the expected attackers per site
function allocate(eA, eB, eMid) {
  const mid = eMid >= 0.75 ? 1 : 0;
  const rest = 5 - mid;
  let a = eA + eB ? Math.round(rest * eA / (eA + eB)) : Math.round(rest / 2);
  a = Math.min(Math.max(a, 1), rest - 1);
  return {A: a, Mid: mid, B: rest - a};
}

function renderT() {
  const rows = teamRows("T");
  const n = rows.length;
  const eA = mean(rows.map(r => r.n_A)), eB = mean(rows.map(r => r.n_B)), eMid = mean(rows.map(r => r.n_Mid));
  const stackA = rows.filter(r => r.n_A >= 3).length, stackB = rows.filter(r => r.n_B >= 3).length;
  const anyRush = rows.filter(r => r.rushers > 0).length;
  const alloc = allocate(eA, eB, eMid);
  document.getElementById("tHead").textContent = t("tHead", teamText());
  document.getElementById("recoCard").innerHTML = n ? `
    <h3 style="margin-top:0">${t("recoTitle", n)}</h3>
    <div class="reco"><span class="pill A">${t("atSite", alloc.A, "A")}</span>${alloc.Mid ? `<span class="pill Mid">${t("atSite", alloc.Mid, "Mid")}</span>` : ""}<span class="pill B">${t("atSite", alloc.B, "B")}</span></div>
    <p class="muted" style="margin:4px 0 0">${t("recoNote")}</p>
    <div class="stats">
      <div class="stat"><div class="v">${eA.toFixed(1)}</div><div class="k">${t("avgTo", "A")}</div></div>
      <div class="stat"><div class="v">${eB.toFixed(1)}</div><div class="k">${t("avgTo", "B")}</div></div>
      <div class="stat"><div class="v">${eMid.toFixed(1)}</div><div class="k">${t("stayMid")}</div></div>
      <div class="stat"><div class="v">${pct(stackA, n)}%</div><div class="k">${t("stackTo", "A")}</div></div>
      <div class="stat"><div class="v">${pct(stackB, n)}%</div><div class="k">${t("stackTo", "B")}</div></div>
      <div class="stat"><div class="v">${pct(anyRush, n)}%</div><div class="k">${t("anyRush")}</div></div>
    </div>` : `<p class="muted">${t("noTRounds")}</p>`;

  const strat = countBy(rows, r => r.strategy).map(([k, v]) => [k, v, k.startsWith("A") ? "A" : k.startsWith("B") ? "B" : ""]);
  const smallRush = rows.filter(r => r.rushers > 0 && r.rushers < 3);
  document.getElementById("tStrat").innerHTML = bars(strat, n) +
    (smallRush.length ? `<p class="muted" style="margin:10px 0 0">${t("smallRush", smallRush.length)}
      ${countBy(smallRush, r => `${r.rush_site} ×${r.rushers}`).map(([k, v]) => `${esc(k)}: ${v}`).join(" · ")}</p>` : "");

  const hist = site => [0, 1, 2, 3, 4, 5].map(k => [t("nTo", k, site), rows.filter(r => r["n_" + site] === k).length, site]);
  document.getElementById("tCounts").innerHTML =
    `<h3 style="margin-top:0">Site A</h3>${bars(hist("A"), n)}<h3>Site B</h3>${bars(hist("B"), n)}`;

  const players = playerRows("T");
  const lines = countBy(players.filter(p => p.opening_line), p => p.opening_line + "|" + p.route).slice(0, 10);
  document.getElementById("tLines").innerHTML = lines.length ? `<div class="table-wrap"><table><tr><th>${t("colPath")}</th><th>${t("colTo")}</th><th class="r">${t("colCount")}</th><th>${t("colUsedBy")}</th></tr>
    ${lines.map(([k, v]) => {
      const [line, route] = k.split("|");
      const users = countBy(players.filter(p => p.opening_line === line && p.route === route), p => p.steamid).slice(0, 3)
        .map(([sid, n]) => `${steamLink(sid, nameOf[sid])} <span class="muted">${n}×</span>`).join(", ");
      return `<tr><td class="line">${esc(line)}</td><td><span style="color:${COLORS[route]}">●</span> ${esc(route)}</td><td class="r">${v}</td><td>${users}</td></tr>`;
    }).join("")}</table></div>`
    : `<p class="muted">${t("noData")}</p>`;

  document.getElementById("tPlayers").innerHTML = playerTable(players, true);
}

function playerTable(players, isT) {
  const by = new Map();
  players.forEach(p => { if (!by.has(p.steamid)) by.set(p.steamid, []); by.get(p.steamid).push(p); });
  const rows = [...by.values()].sort((a, b) => b.length - a.length);
  if (!rows.length) return `<p class="muted">${t("noData")}</p>`;
  return `<table><tr><th>${t("colPlayer")}</th><th class="r">${t("colRounds")}</th><th>${t("colSpread")}</th><th class="r">A</th><th class="r">B</th><th class="r">Mid</th>
    ${isT ? `<th class="r">${t("colRush")}</th><th class="r">${t("colArrive")}</th>` : ""}<th>${t("colFav")}</th></tr>` +
    rows.map(g => {
      const c = {}; g.forEach(p => c[p.route] = (c[p.route] || 0) + 1);
      const arr = g.map(p => p.site_arrival_seconds).filter(v => v != null);
      const fav = countBy(g.filter(p => p.opening_line), p => p.opening_line)[0];
      return `<tr><td>${steamLink(g[0].steamid, g[0].name)}
        <div class="muted" style="font-size:11px">${esc(g[0].steamid)}</div></td><td class="r">${g.length}</td><td>${splitBar(c, g.length)}</td>
        <td class="r">${pct(c.A || 0, g.length)}%</td><td class="r">${pct(c.B || 0, g.length)}%</td><td class="r">${pct(c.Mid || 0, g.length)}%</td>
        ${isT ? `<td class="r">${pct(g.filter(p => p.rush).length, g.length)}%</td><td class="r">${arr.length ? mean(arr).toFixed(0) + " " + t("sec") : "-"}</td>` : ""}
        <td class="line">${fav ? esc(fav[0]) + ` <span class="muted">(${fav[1]}×)</span>` : "-"}</td></tr>`;
    }).join("") + `</table>`;
}

function renderCT() {
  const rows = teamRows("CT");
  const n = rows.length;
  const eA = mean(rows.map(r => r.n_A)), eB = mean(rows.map(r => r.n_B)), eMid = mean(rows.map(r => r.n_Mid));
  const thin = eA <= eB ? "A" : "B";
  document.getElementById("ctHead").textContent = t("ctHead", teamText());

    <p class="muted" style="margin:4px 0 0">${t("ctNote")}</p>
    <div class="stats">
      <div class="stat"><div class="v">${eA.toFixed(1)}</div><div class="k">${t("ctAt", "A")}</div></div>
      <div class="stat"><div class="v">${eB.toFixed(1)}</div><div class="k">${t("ctAt", "B")}</div></div>

  document.getElementById("ctSetups").innerHTML = bars(countBy(rows, r => r.strategy), n);
  document.getElementById("ctPlayers").innerHTML = playerTable(playerRows("CT"), false);

function teamMembers(teamId) {
  const members = new Map();
  DATA.players.filter(p => p.team_id === teamId).forEach(p => members.set(p.steamid, p.name));
  return [...members].map(([sid, name]) => `${steamLink(sid, name)} <span class="muted" style="font-size:11px">${esc(sid)}</span>`).join("<br>");
}

function renderTeams() {
  const rows = teamRows();
  const by = new Map();
  rows.forEach(r => { const k = r.team_id + r.side; if (!by.has(k)) by.set(k, []); by.get(k).push(r); });
  const groups = [...by.values()].sort((a, b) => b.length - a.length);
  document.getElementById("teamTable").innerHTML = groups.length ? `<table><tr><th>${t("colTeam")}</th><th>${t("colSide")}</th><th class="r">${t("colRounds")}</th><th class="r">${t("colWon")}</th><th>${t("colTopStrat")}</th></tr>` +
    groups.map(g => `<tr><td style="white-space:normal">${teamMembers(g[0].team_id)}</td><td>${g[0].side}</td><td class="r">${g.length}</td>
      <td class="r">${pct(g.filter(r => r.won).length, g.length)}%</td>
      <td style="white-space:normal">${countBy(g, r => r.strategy).slice(0, 3).map(([k, v]) => `${esc(k)} <span class="muted">${pct(v, g.length)}%</span>`).join(" · ")}</td></tr>`).join("") + `</table>`
    : `<p class="muted">${t("noData")}</p>`;
}

function mapPoints() {
  const idx = DOT;
  const matchIdx = state.match ? DATA.matches.findIndex(m => m.demo_id === state.match) : -1;
  return DATA.dots.filter(d => d[idx.map_name] === state.map && d[idx.t_seconds] <= state.t &&
    (state.side === "all" || d[idx.side] === state.side) &&
    (!state.player || DATA.roster[d[idx.player]][0] === state.player) &&
    (matchIdx < 0 || d[idx.match] === matchIdx) &&
    (!state.round || d[idx.round_number] === +state.round));
}

// Density image: soft dots accumulated in alpha, then coloured blue > green > yellow > red
function heatImage(pts, toX, toY, view) {
  const S = 512, k = S / view[2], c = document.createElement("canvas");
  c.width = c.height = S;
  const ctx = c.getContext("2d");
  const r = S / 28, alpha = Math.min(0.35, Math.max(0.03, 40 / Math.max(pts.length, 1)));
  for (const d of pts) {
    const x = (toX(d[DOT.X]) - view[0]) * k, y = (toY(d[DOT.Y]) - view[1]) * k;
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, `rgba(0,0,0,${alpha})`);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  const img = ctx.getImageData(0, 0, S, S), px = img.data;
  const stops = [[0, [43, 108, 255]], [0.35, [34, 197, 94]], [0.65, [250, 204, 21]], [1, [239, 68, 68]]];
  for (let i = 0; i < px.length; i += 4) {
    const v = px[i + 3] / 255;
    if (!v) continue;
    let j = 1;
    while (j < stops.length - 1 && v > stops[j][0]) j++;
    const [t0, c0] = stops[j - 1], [t1, c1] = stops[j], f = Math.min(1, (v - t0) / (t1 - t0));
    for (let ch = 0; ch < 3; ch++) px[i + ch] = c0[ch] + (c1[ch] - c0[ch]) * f;
    px[i + 3] = Math.min(230, 60 + v * 255);
  }
  ctx.putImageData(img, 0, 0);
  return `<image href="${c.toDataURL()}" x="${view[0]}" y="${view[1]}" width="${view[2]}" height="${view[2]}"/>`;
}

// Slider range = longest round in the current selection; at the far right it means "until the round ends"
function syncTimeSlider() {
  const savedT = state.t;
  state.t = Infinity;
  const maxT = Math.max(2, ...mapPoints().map(d => d[DOT.t_seconds]));
  state.t = savedT;
  const range = document.getElementById("tRange");
  range.max = Math.ceil(maxT / 2) * 2;
  range.value = Math.min(state.t, +range.max);
  document.getElementById("tVal").textContent = state.t >= maxT ? t("endOfRound", Math.round(maxT)) : state.t;
}

function renderMap() {
  const all = DATA.dots.filter(d => d[DOT.map_name] === state.map);
  syncTimeSlider();
  const pts = mapPoints();
  let roundTxt = t("allRounds");
  if (state.round) {
    const buys = [...new Set(teamRows().filter(t => t.round_number === +state.round).map(t => t.buy))];
    roundTxt = t("roundN", state.round) + (buys.length ? ` · ${buys.join("/")} buy` : "");
    const ends = DATA.teams.filter(t => t.map_name === state.map && t.round_number === +state.round &&
      (!state.match || t.demo_id === state.match) && t.round_seconds != null).map(t => t.round_seconds);
    if (ends.length) roundTxt += state.match ? t("endedAt", Math.round(ends[0]))
                                             : t("endedRange", Math.round(Math.min(...ends)), Math.round(Math.max(...ends)));
  }
  document.getElementById("mapTitle").textContent = "· " + mapName(state.map) + " · " + roundTxt +
    (state.player ? " · " + nameOf[state.player] : "");
  if (!all.length) { document.getElementById("mapSvg").innerHTML = ""; return; }
  const radar = DATA.radars[state.map];
  let W, px, py, bg, view;
  if (radar) {
    W = radar.size;
    px = x => (x - radar.pos_x) / radar.scale;
    py = y => (radar.pos_y - y) / radar.scale;
    bg = `<image href="${radar.image}" x="0" y="0" width="${W}" height="${W}"/>`;
    view = radar.view ? [radar.view[0], radar.view[1], radar.view[2], radar.view[2]] : [0, 0, W, W];
  } else {
    // No radar image: frame the map around the recorded positions
    const xs = all.map(d => d[DOT.X]), ys = all.map(d => d[DOT.Y]);
    const minX = Math.min(...xs), maxY = Math.max(...ys);
    const size = Math.max(Math.max(...xs) - minX, maxY - Math.min(...ys)) || 1, pad = 20;
    W = 700;
    px = x => pad + (x - minX) / size * (W - 2 * pad);
    py = y => pad + (maxY - y) / size * (W - 2 * pad);
    view = [0, 0, W, W];
    bg = all.filter((_, i) => i % 3 === 0).map(d => `<circle cx="${px(d[DOT.X]).toFixed(1)}" cy="${py(d[DOT.Y]).toFixed(1)}" r="1.4" fill="#3a3f48"/>`).join("");
  }

  let layer = "", legend = "";
  if (!state.round) {
    layer = pts.length ? heatImage(pts, px, py, view) : "";
    legend = `<span>${t("heatRare")} <i class="heat-scale"></i> ${t("heatOften")}</span><span>${t("dots", pts.length)}</span>`;
  } else {
    // One line per player per round, ending in a dot with their name
    const paths = new Map();
    for (const d of pts) {
      const key = d[DOT.match] + ":" + d[DOT.round_number] + ":" + d[DOT.player];
      if (!paths.has(key)) paths.set(key, []);
      paths.get(key).push(d);
    }
    const colorOf = new Map();
    [...new Set(pts.map(d => d[DOT.player]))].forEach((p, i) => colorOf.set(p, PLAYER_COLORS[i % PLAYER_COLORS.length]));
    const w = view[2] / 260, fs = view[2] / 70;
    for (const seq of paths.values()) {
      seq.sort((a, b) => a[DOT.t_seconds] - b[DOT.t_seconds]);
      const col = colorOf.get(seq[0][DOT.player]);
      const xy = seq.map(d => [px(d[DOT.X]), py(d[DOT.Y])]);
      const [sx, sy] = xy[0], [ex, ey] = xy[xy.length - 1];
      layer += `<polyline points="${xy.map(([x, y]) => x.toFixed(1) + "," + y.toFixed(1)).join(" ")}" fill="none" stroke="${col}" stroke-width="${w.toFixed(1)}" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>
        <circle cx="${sx.toFixed(1)}" cy="${sy.toFixed(1)}" r="${(w * 1.2).toFixed(1)}" fill="${col}" opacity=".6"/>
        <circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="${(w * 2.2).toFixed(1)}" fill="${col}" stroke="#000" stroke-width="${(w / 2).toFixed(1)}"/>
        <text class="callout" x="${(ex + w * 3).toFixed(0)}" y="${(ey - w * 2).toFixed(0)}" style="font-size:${fs.toFixed(0)}px;fill:${col}">${esc(DATA.roster[seq[0][DOT.player]][1])}</text>`;
    }
    legend = [...colorOf].map(([p, col]) => `<span><i style="background:${col}"></i>${esc(DATA.roster[p][1])}</span>`).join("");
    if (!legend) {
      const side = state.side;
      state.side = "all";
      const sides = [...new Set(mapPoints().map(d => d[DOT.side]))];
      state.side = side;
      legend = `<span>${t("noPlayersRound", state.round)}` +
        (sides.length && side !== "all" ? esc(t("sideHint", whoText(), sides.join(" & "), sides[0])) : "") + `</span>`;
    }
  }
  document.getElementById("mapLegend").innerHTML = legend;
  const labels = state.callouts ? placeCallouts(DATA.places[state.map] || [], px, py, view[2] / 60) : "";
  document.getElementById("mapSvg").innerHTML = `<svg class="map" viewBox="${view.join(" ")}" role="img" aria-label="${esc(t("mapAria", mapName(state.map)))}">${bg}${layer}${labels}</svg>`;
}

// Score from the picked player's side when there is one
function matchLabel(m) {
  const n = scopedMatches().filter(x => x.map_name === m.map_name).indexOf(m) + 1;
  const wins = Object.entries(m.team_wins);
  const mine = state.player ? wins.findIndex(([t]) => t === playerTeam(m.demo_id)) : -1;
  if (mine > 0) wins.reverse();
  const score = wins.map(([, w]) => w).join(":");
  const result = mine < 0 ? "" : " " + t(wins[0][1] > (wins[1] || [0, 0])[1] ? "won" : wins[0][1] < (wins[1] || [0, 0])[1] ? "lost" : "draw");
  return `${mapName(m.map_name)} #${n} · ${score}${result} · ${t("rounds", m.rounds)}`;
}

function renderMatchPickers() {
  const ms = scopedMatches().filter(m => m.map_name === state.map);
  if (state.match && !ms.some(m => m.demo_id === state.match)) { state.match = ""; state.round = ""; }
  document.getElementById("matchSel").innerHTML = `<option value="">${t("allMatches", ms.length)}</option>` +
    ms.map(m => `<option value="${esc(m.demo_id)}" ${m.demo_id === state.match ? "selected" : ""}>${esc(matchLabel(m))}</option>`).join("");
  const scope = state.match ? ms.filter(m => m.demo_id === state.match) : ms;
  const maxRound = Math.max(0, ...scope.map(m => m.rounds));
  if (+state.round > maxRound) state.round = "";
  let opts = `<option value="">${t("allRoundsHeat")}</option>`;
  for (let r = 1; r <= maxRound; r++) {
    const tag = r === 1 || r === 13 ? " · pistol" : "";
    opts += `<option value="${r}" ${String(r) === state.round ? "selected" : ""}>${t("roundN", r)}${tag}${state.match ? "" : t("allMatchesTag")}</option>`;
  }
  document.getElementById("roundSel").innerHTML = opts;
}

const WEAPON_NAMES = {ak47: "AK-47", m4a1: "M4A4", m4a1_silencer: "M4A1-S", awp: "AWP", galilar: "Galil AR", famas: "FAMAS",
  sg556: "SG 553", aug: "AUG", ssg08: "SSG 08", scar20: "SCAR-20", g3sg1: "G3SG1", mac10: "MAC-10", mp9: "MP9", mp7: "MP7",
  mp5sd: "MP5-SD", ump45: "UMP-45", p90: "P90", bizon: "PP-Bizon", glock: "Glock-18", usp_silencer: "USP-S", hkp2000: "P2000",
  p250: "P250", fiveseven: "Five-SeveN", tec9: "Tec-9", cz75a: "CZ75-Auto", deagle: "Desert Eagle", revolver: "R8", elite: "Dual Berettas",
  nova: "Nova", xm1014: "XM1014", mag7: "MAG-7", sawedoff: "Sawed-Off", negev: "Negev", m249: "M249", taser: "Zeus x27",
  hegrenade: "HE Grenade", inferno: "Molotov/Incendiary", molotov: "Molotov", incgrenade: "Incendiary", flashbang: "Flashbang",
  smokegrenade: "Smoke", decoy: "Decoy"};
const weaponName = w => w === "knife" ? t("knife") : WEAPON_NAMES[w] || w;
const HIT_PARTS = ["head", "neck", "chest", "stomach", "left_arm", "right_arm", "left_leg", "right_leg"].map(k => [k]);
const weaponChip = (w, n, big) => `<span class="wicon${big ? " big" : ""}" title="${esc(weaponName(w))}">` +
  (DATA.icons[w] ? `<img src="${DATA.icons[w]}" alt="${esc(weaponName(w))}">` : esc(weaponName(w))) +
  (n != null ? `<b>${n}</b>` : "") + `</span>`;

// Hit/kill rows: [match, round, attacker, victim, attacker side, ...]
function combatRows(rows, role) {
  const matchIdx = state.match ? DATA.matches.findIndex(m => m.demo_id === state.match) : -1;
  const playerIdx = state.player ? DATA.roster.findIndex(r => r[0] === state.player) : -1;
  return rows.filter(r => {
    const m = DATA.matches[r[0]];
    if (m.map_name !== state.map || (matchIdx >= 0 && r[0] !== matchIdx) || !inScope(m.demo_id)) return false;
    if (state.round && r[1] !== +state.round) return false;
    // role = whose side of the event we look at: the attacker (dealt) or the victim (taken)
    const sideOk = state.side === "all" || (role === "attacker" ? r[4] === state.side : r[4] !== state.side);
    const who = role === "attacker" ? r[2] : r[3];
    return sideOk && (playerIdx < 0 || who === playerIdx);
  });
}

function renderCombat() {
  const scope = [state.match ? t("thisMatch") : t("allMatchesLc"), state.round ? t("roundLc", state.round) : t("allRoundsLc"),
    whoText()];
  document.getElementById("combatScope").textContent = "· " + scope.join(" · ");

  const kills = combatRows(DATA.kills, "attacker");
  const wt = document.getElementById("weaponTable");
  if (!kills.length) wt.innerHTML = `<p class="muted">${t("noKills")}</p>`;
  else if (state.player) {
    const byW = countBy(kills, k => k[5]);
    wt.innerHTML = `<table><tr><th>${t("colWeapon")}</th><th class="r">${t("colKill")}</th><th class="r">${t("colHS")}</th></tr>` +
      byW.map(([w, n]) => `<tr><td>${weaponChip(w, null, true)} ${esc(weaponName(w))}</td><td class="r">${n}</td>
        <td class="r">${pct(kills.filter(k => k[5] === w && k[6]).length, n)}%</td></tr>`).join("") +
      `<tr><th>${t("colTotal")}</th><th class="r">${kills.length}</th><th class="r">${pct(kills.filter(k => k[6]).length, kills.length)}%</th></tr></table>`;
  } else {
    const byP = countBy(kills, k => k[2]);
    wt.innerHTML = `<table><tr><th>${t("colPlayer")}</th><th class="r">${t("colKill")}</th><th class="r">${t("colHSShort")}</th><th>${t("colWeapon")}</th></tr>` +
      byP.map(([pi, n]) => {
        const mine = kills.filter(k => k[2] === pi);
        const [sid, name] = DATA.roster[pi];
        return `<tr><td>${steamLink(sid, name)}</td><td class="r">${n}</td><td class="r">${pct(mine.filter(k => k[6]).length, n)}%</td>
          <td style="white-space:normal">${countBy(mine, k => k[5]).slice(0, 5).map(([w, c]) => weaponChip(w, c)).join("")}</td></tr>`;
      }).join("") + `</table>`;
  }

  const role = state.hitView === "dealt" ? "attacker" : "victim";
  const hits = combatRows(DATA.hits, role);
  const body = hits.filter(h => HIT_PARTS.some(([k]) => k === h[5]));
  const other = hits.length - body.length;
  const share = Object.fromEntries(HIT_PARTS.map(([k]) => [k, body.filter(h => h[5] === k).length]));
  const total = body.length, top = Math.max(1, ...Object.values(share));
  const who = whoText();
  const zones = {
    head: `<circle cx="100" cy="40" r="26"/>`, neck: `<rect x="90" y="64" width="20" height="14" rx="3"/>`,
    chest: `<rect x="60" y="78" width="80" height="64" rx="12"/>`, stomach: `<rect x="64" y="142" width="72" height="50" rx="10"/>`,
    right_arm: `<rect x="30" y="82" width="26" height="120" rx="12"/>`, left_arm: `<rect x="144" y="82" width="26" height="120" rx="12"/>`,
    right_leg: `<rect x="66" y="196" width="32" height="162" rx="12"/>`, left_leg: `<rect x="102" y="196" width="32" height="162" rx="12"/>`,
  };
  const centre = {head: [100, 40], neck: [100, 71], chest: [100, 108], stomach: [100, 166], right_arm: [43, 140], left_arm: [157, 140], right_leg: [82, 270], left_leg: [118, 270]};
  let svg = "";
  for (const [k] of HIT_PARTS) {
    const f = share[k] / top;
    svg += `<g fill="#2f343c" stroke="#4a505a" stroke-width="1.5">${zones[k]}</g>`;
    if (share[k]) svg += `<g fill="#ef4444" fill-opacity="${(0.15 + 0.6 * f).toFixed(2)}" stroke="none">${zones[k]}</g>`;
  }
  for (const [k] of HIT_PARTS) {
    if (!share[k]) continue;
    const [x, y] = centre[k], f = share[k] / top;
    svg += `<circle cx="${x}" cy="${y}" r="${(3 + 9 * f).toFixed(1)}" fill="#ff2d2d" stroke="#fff" stroke-width="1.5"/>`;
    if (k !== "neck") svg += `<text x="${x}" y="${y + (k === "head" ? 22 : 26)}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" paint-order="stroke" stroke="#000" stroke-width="3">${pct(share[k], total)}%</text>`;
  }
  const caption = esc(t(state.hitView === "dealt" ? "captionDealt" : "captionTaken", who));
  document.getElementById("bodyTarget").innerHTML = total ? `<div class="body-wrap">
      <svg viewBox="0 0 200 370" role="img" aria-label="${caption}">${svg}</svg>
      <div class="body-list"><p class="muted" style="margin:0 0 8px">${caption} · ${t("hitsCount", total, other)}</p>
        ${bars(HIT_PARTS.map(([k]) => [t(k), share[k]]).filter(([, n]) => n).sort((a, b) => b[1] - a[1]), total)}</div>
    </div>` : `<p class="muted">${t("noHits")}</p>`;
}

// Rounds as columns, one row per player per match: destination + the places on the way
function shortPath(line) {
  const steps = (line || "").split(" > ").filter(p => p && p !== "TSpawn" && p !== "CTSpawn")
    .map(p => p.replace(/^Bombsite([AB])$/, "Site $1"));
  if (steps.length > 4) steps.splice(2, steps.length - 3, "…");
  return steps.join(" › ");
}

function renderRouteTable() {
  // Both teams of every match in view, split into blocks. With a player picked, Sisi follows their
  // team, so the enemy block shows the same rounds from the other side.
  const mine = p => state.player && p.team_id === playerTeam(p.demo_id);
  const rows = DATA.players.filter(p => p.map_name === state.map && (!state.match || p.demo_id === state.match) &&
    inScope(p.demo_id) && (state.side === "all" || !state.player || mine(p) ? state.side === "all" || p.side === state.side
                                                                              : p.side !== state.side));
  const el = document.getElementById("routeTable");
  if (!rows.length) { el.innerHTML = `<p class="muted">${t("noDataFilter")}</p>`; return; }
  const groups = new Map();
  rows.forEach(p => {
    const k = p.demo_id + "|" + p.steamid;
    if (!groups.has(k)) groups.set(k, {demo: p.demo_id, sid: p.steamid, name: p.name, team: p.team_id, rounds: {}});
    groups.get(k).rounds[p.round_number] = p;
  });
  // Order: match, then your team before the enemy team, the picked player first
  const teamRank = g => state.player ? (g.team === playerTeam(g.demo) ? 0 : 1) : 0;
  const list = [...groups.values()].sort((a, b) => a.demo.localeCompare(b.demo) || teamRank(a) - teamRank(b) ||
    a.team.localeCompare(b.team) || (b.sid === state.player) - (a.sid === state.player) || a.name.localeCompare(b.name));
  const roundCols = [...new Set(rows.map(p => p.round_number))].sort((a, b) => a - b);
  const multiMatch = new Set(list.map(g => g.demo)).size > 1;
  const matchOf = Object.fromEntries(DATA.matches.map(m => [m.demo_id, m]));
  const teamTitle = g => {
    if (state.player) return g.team === playerTeam(g.demo) ? t("yourTeam", nameOf[state.player]) : t("enemyTeam");
    const named = DATA.teams.find(t => t.demo_id === g.demo && t.team_id === g.team);
    return t("teamEtc", named && named.team_label ? named.team_label.split(", ")[0] : "");
  };
  // One table per side of the fight; inside it, a header row per match (and per team when no one is picked)
  const table = subset => {
    let html = `<div class="table-wrap"><table class="routes"><tr><th class="sticky">${t("colPlayer")}</th>`;
    for (const r of roundCols) html += `<th class="rnd ${String(r) === state.round ? "sel" : ""}" data-round="${r}">R${r}</th>`;
    html += "</tr>";
    let block = "";
    for (const g of subset) {
      const key = state.player ? g.demo : g.demo + g.team;
      if (key !== block && (multiMatch || !state.player)) {
        const title = [state.player ? "" : teamTitle(g), multiMatch ? matchLabel(matchOf[g.demo]) : ""].filter(Boolean).join(" · ");
        html += `<tr><td class="team-head" colspan="${roundCols.length + 1}"><span>${esc(title)}</span></td></tr>`;
      }
      block = key;
      const tag = g.sid === state.player ? ` <span class="rt Mid" style="font-weight:600">${t("picked")}</span>` : "";
      html += `<tr><td class="sticky">${steamLink(g.sid, g.name)}${tag}<div class="muted" style="font-size:11px">${esc(g.sid)}</div></td>`;
      for (const r of roundCols) {
        const p = g.rounds[r];
        const sel = String(r) === state.round ? " sel" : "";
        if (!p) { html += `<td class="cell${sel}"></td>`; continue; }
        const route = p.route === "unknown" ? "?" : p.route;
        html += `<td class="cell${sel}"><span class="muted">${p.side}</span> <span class="rt ${esc(p.route)}">${esc(route)}</span>${p.rush ? " ⚡" : ""}` +
          `<small>${esc(shortPath(p.opening_line)) || "-"}</small><small>${esc(p.buy)}</small></td>`;
      }
      html += "</tr>";
    }
    return html + "</table></div>";
  };
  const ours = list.filter(g => !state.player || g.team === playerTeam(g.demo));
  const theirs = list.filter(g => state.player && g.team !== playerTeam(g.demo));
  let html = state.player
    ? `<h4 class="team-title ours">${esc(t("yourTeam", nameOf[state.player]))}</h4>${ours.length ? table(ours) : `<p class="muted">${t("noRoundsFilter")}</p>`}` +
      `<h4 class="team-title enemy">${t("enemyTeam")}</h4>${theirs.length ? table(theirs) : `<p class="muted">${t("noRoundsFilter")}</p>`}`
    : table(ours);
  el.innerHTML = html + `<p class="muted" style="font-size:12px;margin:8px 0 0">${t("routesFoot")}</p>`;
  el.querySelectorAll("th.rnd").forEach(th => th.onclick = () => {
    state.round = state.round === th.dataset.round ? "" : th.dataset.round;
    renderMatchPickers(); renderMap(); renderRouteTable(); renderCombat();
  });
}

// Draw callout names, nudging a label down (or dropping it) when it would overlap another
function placeCallouts(places, px, py, size) {
  const boxes = [], out = [];
  for (const [name, x, y] of places) {
    const w = name.length * size * 0.55, h = size * 1.1;
    let cx = px(x), cy = py(y), ok = false;
    for (const dy of [0, h, -h, 2 * h]) {
      const box = [cx - w / 2, cy + dy - h, cx + w / 2, cy + dy];
      if (!boxes.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) {
        boxes.push(box); cy += dy; ok = true; break;
      }
    }
    if (ok) out.push(`<text class="callout" x="${cx.toFixed(0)}" y="${cy.toFixed(0)}" text-anchor="middle" style="font-size:${size.toFixed(0)}px">${esc(name)}</text>`);
  }
  return out.join("");
}

function renderPlayerPicker() {
  const sel = document.getElementById("playerSel");
  const list = [...demosOf].map(([sid, demos]) => [sid, nameOf[sid], demos.size])
    .sort((a, b) => b[2] - a[2] || a[1].localeCompare(b[1]));
  sel.innerHTML = `<option value="">${t("allPlayersN", list.length)}</option>` +
    list.map(([sid, name, n]) => `<option value="${esc(sid)}" ${sid === state.player ? "selected" : ""}>${esc(name)} · ${esc(sid)} · ${t("nMatch", n)}</option>`).join("");
}

function renderFirstKills() {
  const rows = teamRows("T").filter(r => r.first_kill_side);
  const n = rows.length;
  const tWins = rows.filter(r => r.first_kill_side === "T").length;
  document.getElementById("fkSide").innerHTML = `<h3 style="margin-top:0">${t("fkTitle")}</h3>` +
    bars([[t("tFirst"), tWins], [t("ctFirst"), n - tWins]], n) +
    (n ? `<p class="muted">${esc(t("fkNote", teamText(), mean(rows.map(r => r.first_kill_seconds)).toFixed(0)))}</p>` : "");
  document.getElementById("fkPlaces").innerHTML = bars(countBy(rows, r => r.first_kill_place || "?").slice(0, 8), n);
}

// Only maps the picked player has played
function renderMapSeg() {
  const maps = scopedMaps();
  if (!maps.includes(state.map)) { state.map = maps[0]; state.match = ""; state.round = ""; }
  seg(document.getElementById("mapSeg"), maps.map(m => [m, mapName(m)]), "map");
}

function render() {
  const rounds = teamRows("T").length + teamRows("CT").length;
  document.getElementById("sampleWarn").innerHTML = rounds < 30
    ? `<div class="warn">${t("warn", rounds)}</div>` : "";
  renderPlayerPicker(); renderMapSeg(); renderMatchPickers(); renderT(); renderCT(); renderTeams(); renderMap(); renderRouteTable(); renderCombat(); renderFirstKills();
}

// Static text, toggles and every section follow the chosen language
function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll("#langSeg button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  document.getElementById("summary").textContent = t("summary", DATA.summary.demos, DATA.summary.rounds, DATA.summary.players);
  seg(document.getElementById("sideSeg"), [["T", "T"], ["CT", "CT"], ["all", t("sideAll")]], "side", () => { renderMap(); renderRouteTable(); renderCombat(); });
  seg(document.getElementById("hitSeg"), [["dealt", t("hitDealt")], ["taken", t("hitTaken")]], "hitView", renderCombat);
}
document.getElementById("langSeg").onclick = e => {
  const b = e.target.closest("button[data-lang]");
  if (!b || b.dataset.lang === lang) return;
  lang = b.dataset.lang;
  try { localStorage.setItem("cs2-opening-lang", lang); } catch (err) {}
  // The login page only exists when the report is served by the local app (python -m src.app)
document.getElementById("loginLink").hidden = !location.protocol.startsWith("http");
applyLang();
  render();
};
applyLang();
document.getElementById("matchSel").onchange = e => { state.match = e.target.value; state.round = ""; render(); };
document.getElementById("roundSel").onchange = e => { state.round = e.target.value; renderMap(); renderRouteTable(); renderCombat(); };
document.getElementById("playerSel").onchange = e => { state.player = e.target.value; state.match = ""; state.round = ""; render(); };
document.getElementById("calloutChk").onchange = e => { state.callouts = e.target.checked; renderMap(); };
document.getElementById("tRange").oninput = e => {
  state.t = +e.target.value >= +e.target.max ? Infinity : +e.target.value;
  renderMap();
};
render();
</script>
