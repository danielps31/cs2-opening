route_classifier:
  model_type: xgboost
  params:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    objective: multi:softprob
    eval_metric: mlogloss
    early_stopping_rounds: 30
  classes: [A, B, Mid]  # order of route labels; must match keys in maps.yaml zones

position_predictor:
  model_type: mlp
  params:
    hidden_layers: [256, 128, 64]
    dropout: 0.3
    learning_rate: 0.001
    batch_size: 256
    epochs: 200
    patience: 15  # early stopping on validation loss

labels:
  tick_rate: 64
  route_horizon_seconds: 60   # opening window after freeze end (route labels)
  trajectory_max_seconds: 180 # positions are kept until the round ends (1:55 + 40 s bomb timer)
  rush_seconds: 20            # a T player on a bombsite within this time = rush
  ct_setup_seconds: 20        # CT position at this time = their setup
  position_horizons_seconds: [5, 10, 15]

features:
  eco_threshold: 1500    # equip value below this -> eco
  force_threshold: 3500  # below this -> force, otherwise full buy

training:
  val_split: 0.15
  test_split: 0.15
  random_seed: 42
  min_rows_per_map: 100
